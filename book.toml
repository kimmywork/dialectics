# 《走出二选一》/ Beyond Either/Or 发布配置
#
# 每个 edition 对应一种语言：源文件在 markdown/，产物写到 docs/<code>/。
# 改完这里重新运行 `make`。

[site]
url = "https://dialectics.kimleo.net"
default = "zh"                    # 落地页在无法判断语言时的回退

[pdf]
page_size = "A4"

[editions.zh]
code = "zh"
language = "zh-CN"
title = "走出二选一"
subtitle = "大众辩证思维手册"
full_title = "走出二选一：大众辩证思维手册"
author = "Kimmy"
description = "从先秦诸子到现代认知科学，一本讲清楚矛盾、取舍、两难与悖论的大众辩证思维手册。"
source = "markdown/dialectics.md"
homepage = "https://kimleo.net"
repo = "https://github.com/kimmywork/dialectics"
license = "CC BY-NC-SA 4.0"
license_note = "个人使用免费，商业使用需联系作者授权"
license_url = "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans"
keywords = "辩证思维, 批判性思维, 矛盾, 悖论"

[editions.en]
code = "en"
language = "en"
title = "Beyond Either/Or"
subtitle = "A Practical Handbook of Dialectical Thinking"
full_title = "Beyond Either/Or: A Practical Handbook of Dialectical Thinking"
author = "Kimmy"
description = "A practical, example-driven handbook on dialectical thinking—from pre-Qin classics and Kant to modern cognitive science."
source = "markdown/dialectics_en.md"
homepage = "https://kimleo.net"
repo = "https://github.com/kimmywork/dialectics"
license = "CC BY-NC-SA 4.0"
license_note = "Free for personal use; commercial use requires permission"
license_url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
keywords = "dialectical thinking, critical thinking, contradiction, paradox"

[fonts]
family = "Noto Serif SC"
# 中文正文字体走 CDN（Fontsource 的 unicode-range 分包），不把字体放进仓库
chinese_cdn = "https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5"
# 网页只加载 400（标题用合成粗体），省掉约 1 MB 的 700 分包
web_bold = true
source = ""
# 可选：显式指定英文正文字体；留空则自动查找系统的 Newsreader
newsreader_source = ""
