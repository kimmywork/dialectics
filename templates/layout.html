<!doctype html>
<html lang="{{lang}}" data-edition="{{edition}}" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{book_title}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{og_url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:locale:alternate" content="{{og_locale_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{og_description}}">
<meta name="twitter:image" content="{{og_image}}">
<link rel="canonical" href="{{og_url}}">
<link rel="alternate" type="text/markdown" href="dialectics.md" title="Markdown source">
<link rel="image_src" href="{{og_image}}">
{{font_preload}}
<link rel="stylesheet" href="{{asset_prefix}}assets/css/base.css?v={{asset_version}}">
<link rel="stylesheet" href="{{asset_prefix}}assets/css/web.css?v={{asset_version}}">
{{font_cdn}}
<script>
(function () {
  try {
    var t = localStorage.getItem("dialectics.theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body class="{{body_class}}">
<img class="share-thumb" src="{{og_image}}" width="300" height="300" alt="" aria-hidden="true">
<a class="skip-link" href="#main">{{skip}}</a>
<div class="read-progress" aria-hidden="true"><span id="progress-bar"></span></div>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-toggle"
          aria-label="{{menu_open}}" aria-expanded="false" aria-controls="sidebar"
          data-open-label="{{menu_open}}" data-close-label="{{menu_close}}">
    <span class="icon-lines" aria-hidden="true"></span>
  </button>
  <a class="topbar-title" href="index.html">{{short_title}}</a>
  <button class="icon-btn theme-btn" data-theme-toggle aria-label="{{theme}}" title="{{theme}}">
    <span class="theme-dot" aria-hidden="true"></span>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-brand" href="index.html">
      <span class="sidebar-title">{{short_title}}</span>
      <span class="sidebar-sub">{{subtitle}}</span>
    </a>
    <nav class="sidebar-nav" aria-label="{{contents_label}}">
{{nav}}
    </nav>
    <div class="sidebar-foot">
      <a href="index.html#catalog">{{contents_label}}</a>
      <a class="lang-link" href="{{lang_switch_href}}">{{lang_switch}}</a>
      <button class="icon-btn theme-btn" data-theme-toggle aria-label="{{theme}}" title="{{theme}}">
        <span class="theme-dot" aria-hidden="true"></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
{{body}}
    <footer class="page-foot">
      <p>{{book_title}}</p>
      <p>{{author}}{{year}} · <a href="{{license_url}}">{{license}}</a> · <a href="{{repo_url}}">{{github_label}}</a></p>
    </footer>
  </main>
</div>

<script src="{{asset_prefix}}assets/js/app.js?v={{asset_version}}"></script>
</body>
</html>
