<!doctype html>
<html lang="zh-CN" data-lang="{{default}}" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走出二选一 · Beyond Either/Or</title>
<meta name="description" content="《走出二选一：大众辩证思维手册》与英文版 Beyond Either/Or 的双语入口。">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="走出二选一 · Beyond Either/Or">
<meta property="og:title" content="走出二选一 · Beyond Either/Or">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{site_url}}/">
<meta property="og:image" content="{{site_url}}/assets/share/index.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta property="og:locale" content="zh_CN">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="走出二选一 · Beyond Either/Or">
<meta name="twitter:description" content="{{og_description}}">
<meta name="twitter:image" content="{{site_url}}/assets/share/index.png">
<link rel="canonical" href="{{site_url}}/">
<link rel="image_src" href="{{site_url}}/assets/share/index.png">
<link rel="alternate" hreflang="zh" href="zh/index.html">
<link rel="alternate" hreflang="en" href="en/index.html">
{{font_cdn}}
<link rel="stylesheet" href="assets/css/base.css?v={{asset_version}}">
<link rel="stylesheet" href="assets/css/web.css?v={{asset_version}}">
<link rel="stylesheet" href="assets/css/landing.css?v={{asset_version}}">
<script>
(function () {
  var lang = "{{default}}";
  try {
    var stored = localStorage.getItem("dialectics.lang");
    var nav = (navigator.language || "en").toLowerCase();
    lang = stored || (nav.indexOf("zh") === 0 ? "zh" : "en");
    var theme = localStorage.getItem("dialectics.theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (e) {}
  document.documentElement.dataset.lang = lang;
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
})();
</script>
</head>
<body class="landing">
<img class="share-thumb" src="{{site_url}}/assets/share/index.png" width="300" height="300" alt="" aria-hidden="true">
<header class="landing-top">
  <a class="landing-brand" href="index.html">走出二选一 <span>·</span> Beyond Either/Or</a>
  <div class="landing-actions">
    <button class="icon-btn" data-theme-toggle aria-label="切换主题 / Toggle theme"
            title="切换深色 / 浅色 · Toggle theme">
      <span class="theme-dot" aria-hidden="true"></span>
    </button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="zh">中文</button>
      <button type="button" data-set-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="landing-main" id="main">
{{zh_block}}
{{en_block}}
</main>

<footer class="landing-foot">
  <p>Kimmy · {{year}} · <a href="{{license_url}}">{{license}}</a></p>
  <p><a href="https://github.com/kimmywork/dialectics">GitHub</a></p>
</footer>

<script src="assets/js/landing.js?v={{asset_version}}"></script>
</body>
</html>
